name: Compatibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Bash syntax
        run: |
          for script in kainstall*.sh lib/*.sh tests/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -P SCRIPTDIR kainstall*.sh lib/*.sh tests/*.sh
  kubeadm-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minor: ['1.35', '1.36', '1.37']
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated configs with matching kubeadm
        env:
          MINOR: ${{ matrix.minor }}
        run: |
          set -Eeuo pipefail
          version=$(curl -fsSL --retry 3 "https://dl.k8s.io/release/stable-${MINOR}.txt")
          [[ "$version" =~ ^v1\.(35|36|37)\.[0-9]+$ ]]
          test_bin=$(mktemp -d)
          trap 'rm -rf "$test_bin"' EXIT
          curl -fsSL --retry 3 "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubeadm" -o "$test_bin/kubeadm"
          curl -fsSL --retry 3 "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubeadm.sha256" -o "$test_bin/kubeadm.sha256"
          printf '%s  %s\n' "$(cat "$test_bin/kubeadm.sha256")" "$test_bin/kubeadm" | sha256sum --check -
          chmod +x "$test_bin/kubeadm"
          KUBEADM_BIN="$test_bin/kubeadm" bash tests/validate-kubeadm.sh "${version#v}"
